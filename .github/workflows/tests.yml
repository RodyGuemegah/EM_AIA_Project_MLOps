# Qualité de code et tests, à chaque poussée. Aucun service externe :
# ni MinIO, ni MLflow, ni données. C'est une contrainte de conception,
# pas une limite — une CI qui dépend d'une infrastructure ne protège
# plus rien le jour où cette infrastructure est indisponible.

name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  qualite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le lint AVANT les tests : un import mort se voit en deux
      # secondes, sans attendre l'installation complète des dépendances.
      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q